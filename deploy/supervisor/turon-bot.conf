; Supervisor program for the Turon Avto Test bot.
;
;   sudo cp deploy/supervisor/turon-bot.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status turon-bot
;
; Adjust the paths and `user` if you did not follow deploy/UBUNTU-24.04.md.

[program:turon-bot]

; -u keeps stdout unbuffered. Without it Python buffers 8 KB before flushing,
; so `supervisorctl tail -f` shows nothing for minutes and the log is useless
; at exactly the moment you need it.
command=/opt/turon-avto-test-bot/.venv/bin/python -u -m bot
directory=/opt/turon-avto-test-bot
user=turon

autostart=true
autorestart=true

; Consider the process "started" only after it has stayed up this long. The bot
; validates its config, connects to PostgreSQL and authenticates with Telegram
; before polling, so a broken deployment dies within a few seconds — this stops
; supervisor reporting RUNNING for something that is about to exit.
startsecs=15

; Retry a handful of times, then give up and stay FATAL. A tight restart loop
; against a wrong token would hammer the Telegram API and bury the real error.
startretries=5

; SIGINT, not the default SIGTERM: the bot installs a handler for both, but
; SIGINT matches what it sees under Docker and in a terminal, so there is one
; shutdown path to reason about rather than two.
stopsignal=INT

; Long enough for the scheduler to stop and the connection pool to drain.
; Supervisor escalates to SIGKILL after this, which would leave the PostgreSQL
; advisory lock held until the server notices the dead session.
stopwaitsecs=30

; Kill the whole process group. The bot spawns no children today, but a
; half-killed group is a miserable thing to debug if it ever does.
killasgroup=true
stopasgroup=true

; The application writes its own rotating files under logs/. These capture
; anything printed before logging is configured — a config error, an import
; failure, a traceback from a crash during start-up.
stdout_logfile=/var/log/turon-bot/stdout.log
stderr_logfile=/var/log/turon-bot/stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

; Python needs this to print non-ASCII to a pipe; without it Uzbek and Russian
; log lines raise UnicodeEncodeError under supervisor but not in a terminal.
environment=PYTHONIOENCODING="utf-8",PYTHONUNBUFFERED="1"
